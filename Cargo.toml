[workspace]
members = ["crates/trady-domain", "crates/trady-policy", "crates/trady-application", "crates/trady-storage", "crates/trady-adapters", "crates/trady-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"

[workspace.dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
rust_decimal = { version = "=1.43.0", features = ["serde-str"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
jsonschema = { version = "=0.60.2", default-features = false }
postgres = { version = "=0.19.14", features = ["with-serde_json-1", "with-chrono-0_4"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "=0.11.1"
serde_yaml = "=0.9.34"
uuid = { version = "=1.29.0", features = ["v4"] }
ctrlc = "=3.5.2"
quick-xml = "=0.38.4"
trady-domain = { path = "crates/trady-domain" }
trady-policy = { path = "crates/trady-policy" }
trady-application = { path = "crates/trady-application" }
trady-storage = { path = "crates/trady-storage" }
trady-adapters = { path = "crates/trady-adapters" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

