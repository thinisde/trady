local all all trust
host trady trady_migrator,trady_analyst,trady_executor,trady_gateway,trady_lab,trady_verifier,trady_shadow,trady_releaser,trady_release_owner all trust
host all trady_migrator,trady_analyst,trady_executor,trady_gateway,trady_lab,trady_verifier,trady_shadow,trady_releaser,trady_release_owner all reject
