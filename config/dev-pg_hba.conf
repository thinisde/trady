# Disposable loopback-only test server, with no real data or credentials.
local all postgres trust
local trady trady_migrator,trady_analyst,trady_executor,trady_gateway trust
local all trady_migrator,trady_analyst,trady_executor,trady_gateway reject
local all all trust
host trady trady_migrator,trady_analyst,trady_executor,trady_gateway all trust
host all trady_migrator,trady_analyst,trady_executor,trady_gateway all reject
host all all all trust
