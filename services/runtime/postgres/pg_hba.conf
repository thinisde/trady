# Persistent Trady deployment. Container administration uses local peer auth;
# every network application login requires SCRAM and an explicit Trady role.
local all postgres peer
local all all scram-sha-256
host trady trady_migrator,trady_analyst,trady_executor,trady_gateway,trady_lab,trady_verifier,trady_shadow,trady_releaser,trady_release_owner all scram-sha-256
host all all all reject
