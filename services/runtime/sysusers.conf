# Fixed UIDs are referenced by the firewall allowlist. Review for local conflicts.
g trady-ipc 13000
g trady-evaluation-ipc 13010
u trady-analyst 13001 "Trady analyst" /var/lib/trady-analyst /usr/sbin/nologin
u trady-executor 13002 "Trady executor" /var/lib/trady-executor /usr/sbin/nologin
u trady-gateway 13003 "Trady gateway" /var/lib/trady-gateway /usr/sbin/nologin
u trady-lab 13004 "Trady offline lab" /var/lib/trady-lab /usr/sbin/nologin
u trady-evaluator 13005 "Trady sealed evaluator" /var/lib/trady-evaluator /usr/sbin/nologin
m trady-analyst trady-ipc
m trady-executor trady-ipc
m trady-lab trady-evaluation-ipc
m trady-evaluator trady-evaluation-ipc
